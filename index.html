<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>스타스트라이크</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        touch-action: none;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      canvas {
        display: block;
      }

      /* 스크랩 카운터: 화면 오른쪽 위 구석 */
      #hud {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 12px);
        right: 14px;
        display: flex;
        align-items: baseline;
        gap: 6px;
        color: #9dff9a;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-shadow: 0 0 8px rgba(120, 255, 150, 0.5);
        pointer-events: none;
        user-select: none;
      }

      #hud .label {
        font-size: 11px;
        font-weight: 500;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"><span id="scrap-count">0</span><span class="label">SCRAP</span></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
